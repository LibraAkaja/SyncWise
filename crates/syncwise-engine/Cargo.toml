[package]
name = "syncwise-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
fs2 = "0.4"
serde_json = "1"
tempfile = "3"
ts-rs = { version = "10", features = ["serde-compat"] }
walkdir = "2"
strsim = "0.11"
unicode-normalization = "0.1"
unicode-casefold = "0.2"

[dev-dependencies]
proptest = "1"
